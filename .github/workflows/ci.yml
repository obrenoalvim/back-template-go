name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backtemplate
        ports:
          - 5460:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5460/backtemplate?sslmode=disable
      DATABASE_URL: postgres://postgres:postgres@localhost:5460/backtemplate?sslmode=disable
      JWT_SECRET: ci-test-secret-must-be-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
      - run: go build ./...
      - run: gofmt -l . | (! grep .)
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
      - run: go vet ./...
      - run: go test ./... -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
