services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-backtemplate}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '${DB_HOST_PORT:-5460}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-backtemplate}']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-backtemplate}?sslmode=disable
      PORT: 8083
    ports:
      - '${PORT:-8083}:8083'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/healthcheck']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  db-data:
